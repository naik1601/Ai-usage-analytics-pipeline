ai_usage_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: AIRFLOW_AI_USAGE
      role: AI_USAGE_TRANSFORMER
      database: AI_USAGE_ANALYTICS
      warehouse: AI_USAGE_WH
      schema: SILVER
      threads: 4
      private_key_path: "C:/Users/naiks/ai-usage-analytics/orchestration/config/snowflake_key.p8"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_KEY_PASSPHRASE') }}"